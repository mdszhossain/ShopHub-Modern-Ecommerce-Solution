<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Fontawesome CDN -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <!-- Tailwind CDN -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- Vanila CSS -->
        <link rel="stylesheet" href="./global.css">
        <title>ShopHub-Modern-Ecommerce-Solution</title>
    </head>
    <body>
        <!-- Header Part -->
        <header class="fixed w-full z-5"></header>

        <!-- Main Part -->
        <main>
            <div class="index-container"></div>
            <div class="products-container hidden"></div>
            <div class="wishlist-container hidden">
                <section class="wishlist-initial-text text-left relative top-35 sm:p-8 md:px-20 hidden">
                    <h2 class="font-bold text-3xl text-[#2c2c2c] mb-2">My wishlist</h2>
                    <p><span class="wishlist-count">1</span> item saved</p>
                </section>
            </div>
        </main>

        <!-- Footer Part -->
        <footer></footer>


        <!-- Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
        <script src="./app.js"></script>
    </body>
</html>
