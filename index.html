<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Fontawesome CDN -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
        <!-- Tailwind CDN -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <!-- Vanila CSS -->
        <link rel="stylesheet" href="./Styles/global.css">
        <title>ShopHub-Modern-Ecommerce-Solution</title>
    </head>
    <body>
        <!-- Header Part -->
        <header>
            <nav class="nav-bar flex justify-between">
                <div class="nav-left">
                    <div class="nav-logo font-bold text-2xl">
                        <i class="fa-solid fa-cart-flatbed-suitcase text-[#2F5AFB]"></i>
                        <span id="logo-text" class="text-[#2c2c2c]">ShopHub</span>
                    </div>
                    <ul class="nav-pages hidden sm:flex sm:gap-10">
                        <li>Home</li>
                        <li>Products</li>
                        <li>Wishlist</li>
                    </ul>
                </div>
                <div class="nav-right text-right">
                    <div id="hamburger-icon" class="">
                        <i id="hamburger-ic" class="fa-solid fa-bars text-lg"></i>
                        <i id="cross-ic" class="fa-solid fa-xmark hide-item text-lg"></i>
                    </div>
                    <div id="hambg-bottom" class="hamburger-bottom hide-item">
                        <ul class="small-nav-pages">
                            <li>Home</li>
                            <li>Products</li>
                            <li>Wishlist</li>
                        </ul>
                        <div class="nav-right-icon">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <i class="fa-regular fa-heart"></i>
                            <i class="fa-solid fa-cart-flatbed-suitcase"></i>
                        </div>
                    </div>
                </div>
            </nav>
        </header>


        <!-- Main Part -->
        <main></main>


        <!-- Footer Part -->
        <footer></footer>


        <!-- Scripts -->
        <script src="./Scripts/app.js"></script>
    </body>
</html>
